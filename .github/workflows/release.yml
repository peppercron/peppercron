name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (must already exist, e.g. v0.1.0)'
        required: true

permissions:
  contents: read
  # Required for npm provenance: lets the runner mint the OIDC token that
  # attests this tarball was built from this commit in this repository.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # The tag is the release's claim about what is inside it. If it
      # disagrees with package.json, stop rather than publish a version
      # nobody can find by tag.
      - name: Check the tag matches the package version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PKG="v$(node -p "require('./packages/core/package.json').version")"
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $TAG does not match package.json version $PKG"
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run size -w peppercron

      - name: Publish to npm with provenance
        working-directory: packages/core
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
